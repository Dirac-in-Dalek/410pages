<!doctype html><html lang="ko" data-theme="day" data-font="pretendard"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>책 입력 흐름 시안 · 로컬 예제</title><link rel="stylesheet" href="/index.css"><style>:root{--font-base-pt:14pt;--citation-column-width:37rem}html,body,#fixture-root{height:100%;margin:0;overflow:hidden}body{font-family:var(--font-ui-active)}.fixture{height:100%;position:relative}.width-guides{position:absolute;inset:0;pointer-events:none;z-index:5}.width-guides line{stroke:var(--accent);stroke-width:1;stroke-dasharray:4 4;opacity:.5}</style></head><body><div id="mini" class="fixture book-writing-surface" inert style="padding:12px;height:auto"></div><script>window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.type!=='410pages-writing-snapshot')return;const data=event.data.snapshot;if(!data||typeof data.html!=='string'||data.html.length>50000)return;const parsed=new DOMParser().parseFromString(data.html,'text/html');parsed.querySelectorAll('script,style,iframe,object,embed,link').forEach(e=>e.remove());for(const e of parsed.querySelectorAll('*'))for(const a of [...e.attributes])if(a.name.startsWith('on')||a.name==='srcdoc')e.removeAttribute(a.name);const root=document.getElementById('mini');root.replaceChildren(...parsed.body.childNodes);root.style.setProperty('--chapter-indent-step',data.indentStep,'important');root.style.setProperty('--chapter-indent-limit',data.indentLimit,'important');root.dataset.proposed='true';root.dataset.matched=data.matched;root.dataset.copy=!data.hideCopy;root.style.setProperty('--fixture-width-adjust',data.adjustment+'px');document.documentElement.dataset.theme=data.theme;document.documentElement.classList.toggle('dark',data.theme==='night');const text=root.querySelector('textarea');if(text)text.value=data.text;const row=root.querySelector('.book-composer-row');if(row)row.style.setProperty('--composer-rail',(data.rail||0)+'px');root.style.paddingInlineStart=((data.rail||0)+12)+'px';const frame=root.querySelector('.book-composer-frame');if(frame)frame.style.transition='none';const composer=root.querySelector('.book-citation-composer');if(composer){composer.style.marginInlineStart=data.marginInlineStart;composer.style.transition='none';}root.querySelectorAll('input[type=radio]').forEach(r=>r.checked=r.value===data.kind);});</script></body></html>
