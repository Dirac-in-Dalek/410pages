<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="770" viewBox="0 0 1560 770"><style>text{font-family:Arial,"Apple SD Gothic Neo",sans-serif} .rail{fill:none;stroke:#cbc5bc;stroke-width:1.5;stroke-linecap:round} .body{fill:#2e2b27;font-size:17px} .meta{fill:#847e75;font-size:12px}</style><rect width="100%" height="100%" fill="#eeeae4"/><text x="22" y="35" font-size="24" fill="#26231f" font-weight="600">하위 챕터의 본문과 연결선 — 선택용 비교 시안</text><text x="22" y="58" font-size="13" fill="#736d64" font-weight="400">번호는 시안 구분용입니다. 챕터 자동 번호를 추가하는 제안이 아닙니다.</text><rect x="20" y="78" width="500" height="656" rx="12" fill="#faf9f6" stroke="#b89767"/><text x="42" y="111" font-size="19" fill="#26231f" font-weight="600">1  챕터와 본문을 함께 들여쓰기 · 추천</text><text x="42" y="139" font-size="13" fill="#736d64" font-weight="400">유튜브의 이름·본문 묶음과 같은 방식</text><path class="rail" d="M 39 186 l 5 5 l 5 -5"/><text x="62" y="193" font-size="26" fill="#26231f" font-weight="600">시간을 보는 관점</text><path class="rail" d="M 71 242 l 5 5 l 5 -5"/><text x="94" y="249" font-size="22" fill="#26231f" font-weight="600">장기적 관점</text><path class="rail" d="M 44 205 V 223 Q 44 249 64 249"/><path class="rail" d="M 44 223 V 566 Q 44 590 64 590"/><rect x="93" y="270" width="99" height="24" rx="3" fill="#f5ddd9"/><text x="94" y="287" font-size="17" fill="#26231f" font-weight="400">장기적 관점으로 바라보는 시간.</text><text x="94" y="316" font-size="17" fill="#26231f" font-weight="400">같은 문장도 어느 챕터에 놓느냐에 따라</text><text x="94" y="345" font-size="17" fill="#26231f" font-weight="400">다른 맥락으로 읽힙니다.</text><text x="94" y="388" font-size="12" fill="#827b72" font-weight="400">32쪽  ·  이 문장 메모 0</text><path class="rail" d="M 103 422 l 5 5 l 5 -5"/><text x="126" y="429" font-size="19" fill="#26231f" font-weight="600">변화의 시작</text><text x="126" y="464" font-size="16" fill="#26231f" font-weight="400">미래를 다르게 보기 시작한 순간.</text><text x="126" y="492" font-size="12" fill="#827b72" font-weight="400">34쪽  ·  이 문장 메모 1</text><path class="rail" d="M 103 529 l 5 5 l 5 -5"/><text x="126" y="536" font-size="19" fill="#26231f" font-weight="600">반복의 시간</text><path class="rail" d="M 71 593 l 5 5 l 5 -5"/><text x="94" y="600" font-size="22" fill="#26231f" font-weight="600">다음 관점</text><path class="rail" d="M 76 261 V 512 Q 76 536 96 536"/><path class="rail" d="M 76 405 Q 76 429 96 429"/><text x="42" y="680" font-size="14" fill="#26231f" font-weight="400">장점: 제목·본문·메모의 소속이 한눈에 보임</text><text x="42" y="709" font-size="13" fill="#827b72" font-weight="400">약점: 깊어질수록 본문 폭이 줄어듦</text><rect x="530" y="78" width="500" height="656" rx="12" fill="#faf9f6" stroke="#dcd6cd"/><text x="552" y="111" font-size="19" fill="#26231f" font-weight="600">2  본문 정렬 유지 · 짧은 연결선</text><text x="552" y="139" font-size="13" fill="#736d64" font-weight="400">본문 폭을 유지하고 깊이는 제목으로 구분</text><path class="rail" d="M 549 186 l 5 5 l 5 -5"/><text x="572" y="193" font-size="26" fill="#26231f" font-weight="600">시간을 보는 관점</text><path class="rail" d="M 581 242 l 5 5 l 5 -5"/><text x="604" y="249" font-size="22" fill="#26231f" font-weight="600">장기적 관점</text><path class="rail" d="M 554 205 V 223 Q 554 249 574 249"/><path class="rail" d="M 554 223 V 566 Q 554 590 574 590"/><rect x="571" y="270" width="99" height="24" rx="3" fill="#f5ddd9"/><text x="572" y="287" font-size="17" fill="#26231f" font-weight="400">장기적 관점으로 바라보는 시간.</text><text x="572" y="316" font-size="17" fill="#26231f" font-weight="400">같은 문장도 어느 챕터에 놓느냐에 따라</text><text x="572" y="345" font-size="17" fill="#26231f" font-weight="400">다른 맥락으로 읽힙니다.</text><text x="572" y="388" font-size="12" fill="#827b72" font-weight="400">32쪽  ·  이 문장 메모 0</text><path class="rail" d="M 613 422 l 5 5 l 5 -5"/><text x="636" y="429" font-size="19" fill="#26231f" font-weight="600">변화의 시작</text><text x="572" y="464" font-size="16" fill="#26231f" font-weight="400">미래를 다르게 보기 시작한 순간.</text><text x="572" y="492" font-size="12" fill="#827b72" font-weight="400">34쪽  ·  이 문장 메모 1</text><path class="rail" d="M 613 529 l 5 5 l 5 -5"/><text x="636" y="536" font-size="19" fill="#26231f" font-weight="600">반복의 시간</text><path class="rail" d="M 581 593 l 5 5 l 5 -5"/><text x="604" y="600" font-size="22" fill="#26231f" font-weight="600">다음 관점</text><path class="rail" d="M 586 399 V 411 Q 586 429 606 429"/><path class="rail" d="M 586 506 V 518 Q 586 536 606 536"/><text x="552" y="680" font-size="14" fill="#26231f" font-weight="400">장점: 긴 문장이 차지하는 읽기 폭 유지</text><text x="552" y="709" font-size="13" fill="#827b72" font-weight="400">약점: 부모·형제 관계의 연결 표현이 약해짐</text><rect x="1040" y="78" width="500" height="656" rx="12" fill="#faf9f6" stroke="#dcd6cd"/><text x="1062" y="111" font-size="19" fill="#26231f" font-weight="600">3  인용문도 별도 하위 항목으로</text><text x="1062" y="139" font-size="13" fill="#736d64" font-weight="400">인용문과 하위 챕터를 같은 트리 항목으로 표시</text><path class="rail" d="M 1059 186 l 5 5 l 5 -5"/><text x="1082" y="193" font-size="26" fill="#26231f" font-weight="600">시간을 보는 관점</text><path class="rail" d="M 1091 242 l 5 5 l 5 -5"/><text x="1114" y="249" font-size="22" fill="#26231f" font-weight="600">장기적 관점</text><path class="rail" d="M 1064 205 V 223 Q 1064 249 1084 249"/><path class="rail" d="M 1064 223 V 566 Q 1064 590 1084 590"/><rect x="1145" y="270" width="99" height="24" rx="3" fill="#f5ddd9"/><text x="1146" y="287" font-size="17" fill="#26231f" font-weight="400">장기적 관점으로 바라보는 시간.</text><text x="1146" y="316" font-size="17" fill="#26231f" font-weight="400">같은 문장도 어느 챕터에 놓느냐에 따라</text><text x="1146" y="345" font-size="17" fill="#26231f" font-weight="400">다른 맥락으로 읽힙니다.</text><text x="1146" y="388" font-size="12" fill="#827b72" font-weight="400">32쪽  ·  이 문장 메모 0</text><path class="rail" d="M 1123 422 l 5 5 l 5 -5"/><text x="1146" y="429" font-size="19" fill="#26231f" font-weight="600">변화의 시작</text><text x="1178" y="464" font-size="16" fill="#26231f" font-weight="400">미래를 다르게 보기 시작한 순간.</text><text x="1178" y="492" font-size="12" fill="#827b72" font-weight="400">34쪽  ·  이 문장 메모 1</text><path class="rail" d="M 1128 441 V 445 Q 1128 464 1148 464"/><circle cx="1160" cy="459" r="3" fill="#aaa296"/><path class="rail" d="M 1123 529 l 5 5 l 5 -5"/><text x="1146" y="536" font-size="19" fill="#26231f" font-weight="600">반복의 시간</text><path class="rail" d="M 1091 593 l 5 5 l 5 -5"/><text x="1114" y="600" font-size="22" fill="#26231f" font-weight="600">다음 관점</text><path class="rail" d="M 1096 261 V 512 Q 1096 536 1116 536"/><path class="rail" d="M 1096 405 Q 1096 429 1116 429"/><path class="rail" d="M 1096 263 Q 1096 287 1116 287"/><circle cx="1128" cy="282" r="3" fill="#aaa296"/><text x="1062" y="680" font-size="14" fill="#26231f" font-weight="400">장점: 인용문이 들어간 위치를 선으로 확인</text><text x="1062" y="709" font-size="13" fill="#827b72" font-weight="400">약점: 인용문 때문에 한 단계 더 들여써짐</text><text x="22" y="755" font-size="14" fill="#625c52" font-weight="400">공통 제안: 가로 구분선은 평소 숨기고, 올리면 추가 위치를 표시합니다. 현재 앱에는 아직 적용하지 않은 시안입니다.</text></svg>