<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>읽기 영역 축소 미리보기</title><link rel="stylesheet" href="/index.css"><link rel="stylesheet" href="2026-10-06-reading-workspace-fixture.css"><style>html,body{margin:0;overflow:clip}#mirror{position:absolute;top:0;left:0;transform-origin:top left;pointer-events:none}</style></head><body><div id="mirror" inert></div><script>
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='410pages-workspace-snapshot')return;const s=e.data.snapshot;if(!s||typeof s.html!=='string'||s.html.length>250000||![1024,1440,1920,3840].includes(s.width))return;const d=new DOMParser().parseFromString(s.html,'text/html');d.querySelectorAll('script,style,iframe,object,embed,link').forEach(x=>x.remove());for(const x of d.querySelectorAll('*'))for(const a of [...x.attributes])if(a.name.startsWith('on')||a.name==='srcdoc')x.removeAttribute(a.name);const root=document.getElementById('mirror');root.replaceChildren(...d.body.childNodes);root.style.width=s.width+'px';root.style.height=s.height+'px';const crop=Math.max(1000,s.groupWidth+48),scale=Math.min(1,innerWidth/crop,.65);root.style.transform='translateX('+(-Math.max(0,s.groupLeft-24)*scale)+'px) scale('+scale+')';document.documentElement.dataset.theme=s.theme;document.documentElement.classList.toggle('dark',s.theme==='night');root.querySelectorAll('textarea').forEach((t,i)=>{if(typeof s.values?.[i]==='string')t.value=s.values[i];});});
</script></body></html>
